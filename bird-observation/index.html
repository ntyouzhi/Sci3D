<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鸟类观察</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><h1>鸟类观察</h1><nav aria-label="鸟类"><a data-bird="crane" href="?bird=crane">丹顶鹤</a><a data-bird="mallard" href="?bird=mallard">绿头鸭</a><a data-bird="eagle" href="?bird=eagle">老鹰</a></nav></header>
<main><section id="view" aria-label="鸟类三维模型"><div id="modelPlaceholder" class="model-placeholder"><span aria-hidden="true">♧</span><b>正在准备鸟类模型…</b><small>先显示轻量预览，完整动画将在后台继续加载</small></div><div id="status" role="status">正在加载…</div></section>
<aside><h2>播放控制</h2><div class="buttons"><button id="play" class="primary" disabled>播放</button><button id="reset" disabled>复位</button></div>
<label for="speed">播放速度 <span id="speedText">1×</span></label><input id="speed" type="range" min="0.1" max="1.5" step="0.1" value="1" disabled>
<label for="phase">动作位置</label><input id="phase" type="range" min="0" max="1" step="0.005" value="0" disabled><div id="phaseNodes" class="phase-nodes" aria-label="动作节点"></div>
<hr><h2>观察角度</h2><div class="buttons views"><button data-view="side">侧面</button><button data-view="front">正面</button><button data-view="top">上方</button></div>
<section id="birdIntro" class="bird-intro" aria-live="polite"></section>
<div class="signature">vibe coding有志青年</div></aside></main><script type="module" src="app.js"></script>
</body></html>
